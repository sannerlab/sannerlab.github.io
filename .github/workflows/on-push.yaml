name: on-push
run-name: On push to main

on:
  # run on commit to main branch
  push:
    branches:
      - main

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-citations:
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-site:
    needs: update-citations
    # build even if the citation update fails (e.g. a lookup service is down);
    # the committed _data/citations.yaml is then used as is
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-site.yaml
