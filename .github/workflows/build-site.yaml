name: build-site
run-name: Build live site

on:
  # called from on-push
  workflow_call:

  # run manually by user
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      # check out the tip of main, so citations committed earlier in this run are included
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # publications.qmd is generated from _data/citations.yaml by a pre-render script
      - name: Install Python packages
        run: python -m pip install PyYAML

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Build site
        run: quarto render

      - name: Deploy site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: _site
          force: false
