project:
  type: website
  output-dir: _site
  pre-render: _scripts/publications.py
  resources:
  - /adapt/**
  - /wewos/**
  - .nojekyll
  # Bluesky handle @sannerlab.github.io: Bluesky checks this file for the account's DID
  - .well-known/atproto-did
website:
